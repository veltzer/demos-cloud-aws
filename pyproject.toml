# Lets `uv sync` install this repo's Python dependencies.

[project]
name = "demos-cloud-aws"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "boto3",
    "pyclassifiers",
]

[dependency-groups]
dev = [
    "boto3-stubs",
    "mypy",
    "pylint",
    "pytest",
    "ruff",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.mypy]
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type stubs; `foo.*` also matches `foo` itself.
[[tool.mypy.overrides]]
module = [
    "boto3.*",
]
ignore_missing_imports = true
